<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Personal Global Website</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-header">
                <img src="../logo.png" alt="Admin Logo" class="admin-login-logo">
                <h1>Admin Login</h1>
                <p>Personal Global Website &amp; CMS</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Toggle password visibility"
                        >Show</button>
                    </div>
                </div>

                <div id="loginMessage" class="login-message" role="alert"></div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    <span id="loginButtonText">Login to Dashboard</span>
                </button>
            </form>

            <div class="login-footer">
                <p>Protected Administrator Portal</p>
                <a href="../index.html">&larr; Back to Website</a>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
