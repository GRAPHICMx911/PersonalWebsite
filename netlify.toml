# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION
# Production URLs:
#   Public Website: https://muneebahmad.netlify.app
#   Admin CMS:      https://muneebahmad.netlify.app/admin
# ==============================================================================

[build]
  publish = "frontend"

# Reverse-proxy /api requests transparently to the live production backend
[[redirects]]
  from = "/api/*"
  to = "https://personal-website-phi-three-11.vercel.app/api/:splat"
  status = 200
  force = true

# Route /admin to /admin/dashboard.html
[[redirects]]
  from = "/admin"
  to = "/admin/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/dashboard.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
