[build]
  publish = "frontend"

# Reverse-proxy all /api requests transparently to the live backend
[[redirects]]
  from = "/api/*"
  to = "https://personal-website-phi-three-11.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "https://personal-website-phi-three-11.vercel.app/docs"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "https://personal-website-phi-three-11.vercel.app/openapi.json"
  status = 200
  force = true

# Admin CMS routing
[[redirects]]
  from = "/admin"
  to = "/admin/dashboard.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/dashboard.html"
  status = 301

# Public site root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
